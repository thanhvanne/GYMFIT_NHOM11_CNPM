<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Người dùng - GYMFIT</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="app-page">

<aside class="sidebar">

    <a class="sidebar-brand"
       href="/admin/dashboard">
        <span class="brand-mark">G</span>
        <span>GYMFIT</span>
    </a>

    <nav class="sidebar-nav">

        <a class="nav-item"
           href="/admin/dashboard">
            Tổng quan
        </a>

        <a class="nav-item"
           href="/admin/branches">
            Chi nhánh
        </a>

        <a class="nav-item"
           href="/admin/members">
            Hội viên
        </a>

        <a class="nav-item"
           href="/admin/plans">
            Gói tập
        </a>

        <a class="nav-item"
           href="/admin/sales">
            Bán hàng
        </a>

        <a class="nav-item"
           href="/admin/bookings">
            Đặt lịch
        </a>

        <a class="nav-item"
           href="/admin/checkins">
            Check-in
        </a>

        <a class="nav-item"
           href="/admin/reports">
            Báo cáo
        </a>

        <a class="nav-item active"
           href="/admin/users">
            Người dùng
        </a>

    </nav>

    <button id="logout-button"
            class="sidebar-logout">
        Đăng xuất
    </button>

</aside>

<main class="app-content">

    <header class="page-header">

        <div>
            <h1>Người dùng</h1>

            <p class="muted">
                Quản lý tài khoản đăng nhập hệ thống
            </p>
        </div>

        <button id="create-user-button"
                type="button"
                class="button button-primary">
            + Thêm người dùng
        </button>

    </header>

    <div id="page-error"
         class="alert alert-error hidden">
    </div>

    <div id="page-success"
         class="alert alert-success hidden">
    </div>

    <section class="panel">

        <div class="toolbar">

            <input id="user-search"
                   type="search"
                   class="toolbar-search"
                   placeholder="Tên hoặc email...">

            <select id="user-role-filter">

                <option value="">
                    Tất cả role
                </option>

                <option value="ADMIN">
                    ADMIN
                </option>

                <option value="BRANCH_MANAGER">
                    BRANCH_MANAGER
                </option>

                <option value="MEMBER">
                    MEMBER
                </option>

            </select>

        </div>

        <div class="table-wrap">

            <table class="data-table">

                <thead>
                <tr>
                    <th>Người dùng</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Scope</th>
                    <th>Trạng thái</th>
                    <th>Ngày tạo</th>
                    <th></th>
                </tr>
                </thead>

                <tbody id="user-table-body">
                </tbody>

            </table>

        </div>

    </section>

</main>

<div id="user-modal"
     class="modal-backdrop hidden">

    <div class="modal-card modal-large">

        <div class="modal-header">

            <div>
                <h2 id="user-modal-title">
                    Thêm người dùng
                </h2>

                <p class="muted">
                    Role và scope được kiểm tra lại ở backend
                </p>
            </div>

            <button id="user-modal-close"
                    type="button"
                    class="icon-button">
                ×
            </button>

        </div>

        <form id="user-form"
              class="form-grid">

            <input id="user-id"
                   type="hidden">

            <label>
                <span>Họ và tên</span>

                <input id="user-full-name"
                       maxlength="120"
                       required>
            </label>

            <label>
                <span>Email</span>

                <input id="user-email"
                       type="email"
                       maxlength="150"
                       required>
            </label>

            <label>
                <span id="password-label">
                    Mật khẩu
                </span>

                <input id="user-password"
                       type="password"
                       maxlength="72"
                       autocomplete="new-password">
            </label>

            <label>
                <span>Role</span>

                <select id="user-role"
                        required>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                    <option value="BRANCH_MANAGER">
                        BRANCH_MANAGER
                    </option>

                    <option value="MEMBER">
                        MEMBER
                    </option>

                </select>
            </label>

            <label>
                <span>Trạng thái</span>

                <select id="user-status"
                        required>

                    <option value="ACTIVE">
                        Hoạt động
                    </option>

                    <option value="LOCKED">
                        Khóa
                    </option>

                    <option value="DISABLED">
                        Vô hiệu hóa
                    </option>

                </select>
            </label>

            <label id="user-branch-field"
                   class="hidden">

                <span>Chi nhánh</span>

                <select id="user-branch">
                </select>

            </label>

            <label id="user-member-field"
                   class="hidden">

                <span>Hội viên</span>

                <select id="user-member">
                </select>

            </label>

            <div id="user-form-error"
                 class="alert alert-error field-full hidden">
            </div>

            <div class="modal-actions field-full">

                <button id="user-cancel-button"
                        type="button"
                        class="button button-secondary">
                    Hủy
                </button>

                <button id="user-save-button"
                        type="submit"
                        class="button button-primary">
                    Lưu
                </button>

            </div>

        </form>

    </div>

</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/admin/users.js}"></script>

</body>
</html>
