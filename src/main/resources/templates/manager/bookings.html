<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Đặt lịch - GYMFIT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-page">

<aside class="sidebar">
    <a class="sidebar-brand" href="/manager/dashboard">
        <span class="brand-mark">G</span>
        <span>GYMFIT</span>
    </a>

    <nav class="sidebar-nav">
        <a class="nav-item" href="/manager/dashboard">Tổng quan</a>
        <a class="nav-item" href="/manager/members">Hội viên</a>
        <a class="nav-item" href="/manager/plans">Gói tập</a>
        <a class="nav-item" href="/manager/sales">Bán hàng</a>
        <a class="nav-item active" href="/manager/bookings">Đặt lịch</a>
        <a class="nav-item" href="/manager/checkins">Check-in</a>
    </nav>

    <button id="logout-button"
            class="sidebar-logout">
        Đăng xuất
    </button>
</aside>

<main class="app-content">

    <header class="page-header">
        <div>
            <h1>Đặt lịch</h1>
            <p id="branch-name" class="muted">
                Lịch tập tại chi nhánh
            </p>
        </div>

        <button id="create-booking-button"
                type="button"
                class="button button-primary">
            + Tạo booking
        </button>
    </header>

    <div id="page-error"
         class="alert alert-error hidden"></div>

    <div id="page-success"
         class="alert alert-success hidden"></div>

    <section class="panel">

        <div class="toolbar">
            <input id="booking-search"
                   class="toolbar-search"
                   type="search"
                   placeholder="Booking, tên hoặc mã hội viên...">

            <select id="status-filter">
                <option value="">Tất cả</option>
                <option value="CONFIRMED">Đã xác nhận</option>
                <option value="COMPLETED">Hoàn thành</option>
                <option value="CANCELLED">Đã hủy</option>
            </select>
        </div>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Mã booking</th>
                    <th>Hội viên</th>
                    <th>Dịch vụ</th>
                    <th>Facility</th>
                    <th>Thời gian</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
                </thead>

                <tbody id="booking-body"></tbody>
            </table>
        </div>

    </section>

</main>

<div id="booking-modal"
     class="modal-backdrop hidden">

    <div class="modal-card">

        <div class="modal-header">
            <div>
                <h2>Tạo booking</h2>
                <p class="muted">
                    Chi nhánh được lấy từ tài khoản quản lý
                </p>
            </div>

            <button id="booking-modal-close"
                    type="button"
                    class="icon-button">
                ×
            </button>
        </div>

        <form id="booking-form"
              class="form-grid">

            <label class="field-full">
                <span>Hội viên</span>
                <select id="booking-member"
                        required></select>
            </label>

            <label>
                <span>Dịch vụ</span>
                <select id="booking-service"
                        required></select>
            </label>

            <label>
                <span>Facility</span>
                <select id="booking-facility"
                        required></select>
            </label>

            <label>
                <span>Ngày</span>
                <input id="booking-date"
                       type="date"
                       required>
            </label>

            <label>
                <span>Khung giờ</span>
                <select id="booking-slot"
                        required></select>
            </label>

            <div id="booking-form-error"
                 class="alert alert-error field-full hidden"></div>

            <div class="modal-actions field-full">
                <button type="submit"
                        class="button button-primary">
                    Tạo booking
                </button>
            </div>

        </form>
    </div>
</div>

<div id="cancel-modal"
     class="modal-backdrop hidden">

    <div class="modal-card">
        <div class="modal-header">
            <h2>Hủy booking</h2>

            <button id="cancel-modal-close"
                    class="icon-button"
                    type="button">
                ×
            </button>
        </div>

        <form id="cancel-form"
              class="form-stack">

            <input id="cancel-id"
                   type="hidden">

            <label>
                <span>Lý do</span>
                <textarea id="cancel-reason"
                          maxlength="200"
                          required></textarea>
            </label>

            <button type="submit"
                    class="button button-danger">
                Xác nhận hủy
            </button>
        </form>
    </div>
</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/manager/bookings.js}"></script>

</body>
</html>
