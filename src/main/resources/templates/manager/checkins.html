<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Check-in - GYMFIT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-page">

<aside class="sidebar">
    <a class="sidebar-brand" href="/manager/dashboard">
        <span class="brand-mark">G</span>
        <span>GYMFIT</span>
    </a>

    <nav class="sidebar-nav">
        <a class="nav-item" href="/manager/dashboard">Tổng quan</a>
        <a class="nav-item" href="/manager/members">Hội viên</a>
        <a class="nav-item" href="/manager/plans">Gói tập</a>
        <a class="nav-item" href="/manager/sales">Bán hàng</a>
        <a class="nav-item" href="/manager/bookings">Đặt lịch</a>
        <a class="nav-item active" href="/manager/checkins">Check-in</a>
    </nav>

    <button id="logout-button"
            class="sidebar-logout">
        Đăng xuất
    </button>
</aside>

<main class="app-content">

    <header class="page-header">
        <div>
            <h1>Check-in</h1>
            <p id="branch-name" class="muted">
                Check-in chi nhánh
            </p>
        </div>
    </header>

    <div id="page-error"
         class="alert alert-error hidden"></div>

    <div id="page-success"
         class="alert alert-success hidden"></div>

    <section class="checkin-actions-grid">

        <article class="panel">

            <h2>Thủ công</h2>

            <form id="manual-form"
                  class="form-stack">

                <label>
                    <span>Mã hội viên / SĐT</span>

                    <input id="member-identifier"
                           maxlength="30"
                           required
                           placeholder="GF000001">
                </label>

                <label>
                    <span>Dịch vụ</span>

                    <select id="manual-service"
                            required></select>
                </label>

                <button type="submit"
                        class="button button-primary">
                    Check-in
                </button>

            </form>

        </article>

        <article class="panel">

            <h2>QR động</h2>

            <form id="qr-form"
                  class="form-stack">

                <label>
                    <span>QR token</span>

                    <textarea id="qr-token"
                              rows="5"
                              required></textarea>
                </label>

                <label>
                    <span>Dịch vụ</span>

                    <select id="qr-service"
                            required></select>
                </label>

                <button type="submit"
                        class="button button-primary">
                    Xác nhận QR
                </button>

            </form>

        </article>

    </section>

    <section class="panel checkin-history">

        <div class="panel-header">
            <div>
                <h2>Lịch sử</h2>
                <p class="muted">
                    Check-in của chi nhánh
                </p>
            </div>
        </div>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Thời gian</th>
                    <th>Hội viên</th>
                    <th>Dịch vụ</th>
                    <th>Phương thức</th>
                    <th>Kết quả</th>
                    <th>Lý do</th>
                </tr>
                </thead>

                <tbody id="checkin-body"></tbody>
            </table>
        </div>

    </section>

</main>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/manager/checkins.js}"></script>

</body>
</html>
