<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Gói tập - GYMFIT</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="app-page">

<aside class="sidebar">

    <a class="sidebar-brand"
       href="/manager/dashboard">
        <span class="brand-mark">G</span>
        <span>GYMFIT</span>
    </a>

    <nav class="sidebar-nav">
        <a class="nav-item"
           href="/manager/dashboard">
            Tổng quan
        </a>

        <a class="nav-item"
           href="/manager/members">
            Hội viên
        </a>

        <a class="nav-item active"
           href="/manager/plans">
            Gói tập
        </a>

        <a class="nav-item"
           href="/manager/sales">
            Bán hàng
        </a>

        <a class="nav-item"
           href="/manager/bookings">
            Đặt lịch
        </a>

        <a class="nav-item"
           href="/manager/checkins">
            Check-in
        </a>
    </nav>

    <button id="logout-button"
            class="sidebar-logout">
        Đăng xuất
    </button>

</aside>

<main class="app-content">

    <header class="page-header">
        <div>
            <h1>Gói tập</h1>

            <p class="muted">
                Các gói tập tại chi nhánh
            </p>
        </div>
    </header>

    <div id="page-error"
         class="alert alert-error hidden">
    </div>

    <section class="panel">

        <div class="toolbar">

            <input id="plan-search"
                   type="search"
                   class="toolbar-search"
                   placeholder="Tìm tên hoặc mã gói...">

            <select id="plan-status">

                <option value="">
                    Tất cả trạng thái
                </option>

                <option value="ACTIVE">
                    Hoạt động
                </option>

                <option value="INACTIVE">
                    Ngừng hoạt động
                </option>

            </select>

        </div>

        <div id="plan-grid"
             class="manager-plan-grid">
        </div>

    </section>

</main>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/manager/plans.js}"></script>

</body>
</html>
