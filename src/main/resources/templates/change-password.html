<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu - GYMFIT</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>
<body class="login-page">

<main class="login-card">
    <div class="brand">
        <div class="brand-mark">G</div>

        <div>
            <div class="brand-name">GYMFIT</div>
            <div class="muted">
                Gym Management System
            </div>
        </div>
    </div>

    <h1>Đổi mật khẩu</h1>

    <!-- Hiện khi tài khoản mới, còn nợ đổi mật khẩu (D3) -->
    <div id="change-password-notice"
         class="alert alert-error hidden">
        Bạn phải đổi mật khẩu trước khi tiếp tục
        sử dụng hệ thống.
    </div>

    <p class="muted">
        Mật khẩu mới tối thiểu 8 ký tự và phải có
        cả chữ lẫn số.
    </p>

    <p class="muted small">
        Tài khoản:
        <strong id="change-password-user">—</strong>
    </p>

    <form id="change-password-form"
          class="form-stack">

        <label>
            <span>Mật khẩu hiện tại</span>
            <input
                    id="current-password"
                    type="password"
                    autocomplete="current-password"
                    required
                    placeholder="••••••••">
        </label>

        <label>
            <span>Mật khẩu mới</span>
            <input
                    id="new-password"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    placeholder="••••••••">
        </label>

        <label>
            <span>Nhập lại mật khẩu mới</span>
            <input
                    id="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                    placeholder="••••••••">
        </label>

        <div id="change-password-error"
             class="alert alert-error hidden">
        </div>

        <button
                id="change-password-button"
                class="button button-primary"
                type="submit">
            Đổi mật khẩu
        </button>

        <button
                id="change-password-cancel"
                class="button button-secondary"
                type="button">
            Đăng xuất
        </button>
    </form>
</main>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/change-password.js}"></script>

</body>
</html>
