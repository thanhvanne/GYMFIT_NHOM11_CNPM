<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Hồ sơ - GYMFIT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="member-app">

<div class="member-shell">

    <header class="member-header">
        <a href="/member/home"
           class="member-brand">
            <span class="brand-mark">G</span>
            <span>GYMFIT</span>
        </a>

        <button id="logout-button"
                type="button"
                class="button button-secondary button-small">
            Đăng xuất
        </button>
    </header>

    <main class="member-main">

        <header class="member-page-header">
            <h1>Hồ sơ</h1>
            <p class="muted">
                Thông tin hội viên
            </p>
        </header>

        <div id="page-error"
             class="alert alert-error hidden"></div>

        <section class="panel">

            <div class="member-profile-head">

                <div id="profile-avatar"
                     class="member-profile-avatar">
                    M
                </div>

                <div>
                    <h2 id="profile-name">
                        Hội viên
                    </h2>

                    <div id="profile-code"
                         class="muted">
                        —
                    </div>
                </div>

            </div>

            <div class="member-profile-grid">

                <div class="member-profile-row">
                    <span>Email</span>
                    <strong id="profile-email">—</strong>
                </div>

                <div class="member-profile-row">
                    <span>Điện thoại</span>
                    <strong id="profile-phone">—</strong>
                </div>

                <div class="member-profile-row">
                    <span>Chi nhánh chính</span>
                    <strong id="profile-branch">—</strong>
                </div>

                <div class="member-profile-row">
                    <span>Ngày sinh</span>
                    <strong id="profile-dob">—</strong>
                </div>

            </div>

        </section>

        <section class="panel member-section">

            <div class="panel-header">
                <div>
                    <h2>Gói đang hoạt động</h2>
                    <p class="muted">
                        Tất cả gói hiện có của bạn
                    </p>
                </div>

                <a href="/member/plans"
                   class="button button-primary button-small">
                    Mua thêm
                </a>
            </div>

            <div id="profile-memberships"
                 class="member-membership-list">
            </div>

        </section>

        <!-- F7.5 – đổi mật khẩu bất cứ lúc nào, cùng API với trang bắt buộc -->
        <section class="panel member-section">

            <div class="panel-header">
                <div>
                    <h2>Đổi mật khẩu</h2>
                    <p class="muted">
                        Mật khẩu mới tối thiểu 8 ký tự,
                        gồm cả chữ và số.
                    </p>
                </div>
            </div>

            <form id="profile-password-form"
                  class="form-stack">

                <label>
                    <span>Mật khẩu hiện tại</span>
                    <input
                            id="profile-current-password"
                            type="password"
                            autocomplete="current-password"
                            required
                            placeholder="••••••••">
                </label>

                <label>
                    <span>Mật khẩu mới</span>
                    <input
                            id="profile-new-password"
                            type="password"
                            autocomplete="new-password"
                            required
                            minlength="8"
                            placeholder="••••••••">
                </label>

                <label>
                    <span>Nhập lại mật khẩu mới</span>
                    <input
                            id="profile-confirm-password"
                            type="password"
                            autocomplete="new-password"
                            required
                            minlength="8"
                            placeholder="••••••••">
                </label>

                <div id="profile-password-error"
                     class="alert alert-error hidden">
                </div>

                <div id="profile-password-success"
                     class="alert alert-success hidden">
                </div>

                <button
                        id="profile-password-button"
                        class="button button-primary"
                        type="submit">
                    Đổi mật khẩu
                </button>
            </form>

        </section>

    </main>

    <div th:replace="~{fragments/member-nav :: nav(activePage='profile')}"></div>

</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/member/profile.js}"></script>

</body>
</html>
