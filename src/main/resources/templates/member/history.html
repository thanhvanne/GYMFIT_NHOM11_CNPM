<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Lịch sử - GYMFIT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="member-app">

<div class="member-shell">

    <header class="member-header">
        <a href="/member/home"
           class="member-brand">
            <span class="brand-mark">G</span>
            <span>GYMFIT</span>
        </a>
    </header>

    <main class="member-main">

        <header class="member-page-header">
            <h1>Lịch sử</h1>
            <p class="muted">
                Hoạt động của tài khoản
            </p>
        </header>

        <div id="page-error"
             class="alert alert-error hidden"></div>

        <div class="member-tab-list">

            <button class="member-tab active"
                    data-tab="booking"
                    type="button">
                Booking
            </button>

            <button class="member-tab"
                    data-tab="checkin"
                    type="button">
                Check-in
            </button>

            <button class="member-tab"
                    data-tab="order"
                    type="button">
                Giao dịch
            </button>

        </div>

        <section class="panel">

            <div id="history-content"
                 class="member-list">
            </div>

        </section>

    </main>

    <div th:replace="~{fragments/member-nav :: nav(activePage='history')}"></div>

</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/core/invoice.js}"></script>
<script th:src="@{/js/member/history.js}"></script>

</body>
</html>
