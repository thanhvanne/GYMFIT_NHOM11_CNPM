<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Đặt lịch - GYMFIT</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="member-app">

<div class="member-shell">

    <header class="member-header">
        <a href="/member/home"
           class="member-brand">
            <span class="brand-mark">G</span>
            <span>GYMFIT</span>
        </a>
    </header>

    <main class="member-main">

        <header class="member-page-header">
            <h1>Đặt lịch</h1>

            <p id="branch-name"
               class="muted">
                Chọn gói, loại hình thể thao và thời gian
            </p>
        </header>

        <div id="page-error"
             class="alert alert-error hidden">
        </div>

        <div id="page-success"
             class="alert alert-success hidden">
        </div>

        <section class="member-form-card">

            <div class="form-stack">

                <div>
                    <strong>Dịch vụ</strong>

                    <div id="service-selector"
                         class="member-service-selector">
                    </div>
                </div>

                <label>
                    <span>Chi nhánh của gói tập</span>
                    <select id="branch-select"></select>
                </label>

                <label>
                    <span>Cơ sở vật chất</span>
                    <select id="facility-select"></select>
                </label>

                <label>
                    <span>Ngày</span>
                    <input id="booking-date"
                           type="date">
                </label>

                <div>
                    <strong>Khung giờ</strong>

                    <div id="slot-grid"
                         class="member-slot-grid">
                    </div>
                </div>

                <button id="submit-booking"
                        type="button"
                        class="button button-primary"
                        disabled>
                    Xác nhận đặt lịch
                </button>

            </div>

        </section>

        <section class="member-section">

            <div class="member-section-header">
                <h2>Lịch sắp tới</h2>
            </div>

            <div id="upcoming-bookings"
                 class="member-list">
            </div>

        </section>

    </main>

    <div th:replace="~{fragments/member-nav :: nav(activePage='booking')}"></div>

</div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/member/booking.js}"></script>

</body>
</html>
