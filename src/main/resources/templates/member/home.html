<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Trang chủ - GYMFIT</title>

    <link rel="stylesheet"
          th:href="@{/css/app.css}">
</head>

<body class="member-app">

<div class="member-shell">

    <header class="member-header">

        <a href="/member/home"
           class="member-brand">
            <span class="brand-mark">G</span>
            <span>GYMFIT</span>
        </a>

        <button id="logout-button"
                type="button"
                class="button button-secondary button-small">
            Đăng xuất
        </button>

    </header>

    <main class="member-main">

        <header class="member-page-header">
            <p class="muted">
                Xin chào,
            </p>

            <h1 id="member-name">
                Hội viên
            </h1>

            <div id="member-code"
                 class="muted">
                —
            </div>
        </header>

        <div id="page-error"
             class="alert alert-error hidden"></div>

        <section class="member-section member-memberships-section">

            <div class="member-section-header">
                <div>
                    <h2>Gói đang hoạt động</h2>
                    <p class="muted small">
                        Các gói có thể cùng hoạt động và cộng dồn loại hình sử dụng.
                    </p>
                </div>

                <a href="/member/plans"
                   class="button button-primary button-small">
                    Mua thêm
                </a>
            </div>

            <div id="membership-list"
                 class="member-membership-list">
            </div>

        </section>

        <section class="member-home-stats">

            <article class="stat-card">
                <span>Lịch sắp tới</span>
                <strong id="upcoming-count">0</strong>
            </article>

            <article class="stat-card">
                <span>Check-in</span>
                <strong id="checkin-count">0</strong>
            </article>

        </section>

        <section class="member-section">

            <div class="member-section-header">
                <h2>Dịch vụ của bạn</h2>

                <a class="button button-secondary button-small"
                   href="/member/booking">
                    Đặt lịch
                </a>
            </div>

            <div id="service-grid"
                 class="member-service-grid">
            </div>

        </section>

        <section class="member-section">

            <div class="member-section-header">
                <h2>Lịch sắp tới</h2>

                <a href="/member/history"
                   class="muted">
                    Xem tất cả
                </a>
            </div>

            <div id="upcoming-list"
                 class="member-list">
            </div>

        </section>

    </main>

    <div th:replace="~{fragments/member-nav :: nav(activePage='home')}"></div>

</div>

<div th:replace="~{fragments/ai-chat :: chat}"></div>

<script th:src="@{/js/core/api.js}"></script>
<script th:src="@{/js/core/auth.js}"></script>
<script th:src="@{/js/core/chat.js}"></script>
<script th:src="@{/js/member/home.js}"></script>

</body>
</html>
