server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: gymfit

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=gymfit;encrypt=true;trustServerCertificate=true}
    username: sa
    password: 123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        format_sql: false

  thymeleaf:
    cache: false
    encoding: UTF-8

gymfit:
  jwt:
    secret: ${JWT_SECRET:GYMFITJwtSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026}
    ttl-seconds: 7200
  qr:
    secret: ${QR_SECRET:GYMFITQrSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026}
    ttl-seconds: 60
  chatbot:
    model-path: classpath:chatbot/model/intent-model.bin
    threshold-accept: 0.70
    threshold-clarify: 0.40
    history-limit: 10
    session-idle-minutes: 30
    pending-action-ttl-minutes: 5
    rate-limit-per-minute: 20
    low-stock-threshold: 10

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN