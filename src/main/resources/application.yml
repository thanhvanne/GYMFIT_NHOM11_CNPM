server:
  port: 8080
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: gymfit

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=gymfit;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        format_sql: false

  thymeleaf:
    cache: false
    encoding: UTF-8

gymfit:
  jwt:
    secret: ${JWT_SECRET:GYMFITJwtSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026}
    ttl-seconds: 7200
  qr:
    secret: ${QR_SECRET:GYMFITQrSecretKeyMustBeAtLeastThirtyTwoCharactersLong2026}
    ttl-seconds: 60
  ai:
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN